# Default config baked into the Docker image (/etc/mcpgw/mcpgw.toml).
# Mount your own file over it to choose servers:
#   -v ./mcpgw.toml:/etc/mcpgw/mcpgw.toml:ro
#
# Inside a container the gateway must listen on 0.0.0.0, which mcpgw only allows
# with an API key: set MCPGW_API_KEY. Publish the port on loopback
# (-p 127.0.0.1:8765:8765) so OAuth redirects to http://localhost:8765 work.

[gateway]
host = "${MCPGW_HOST:-0.0.0.0}"
port = "${MCPGW_PORT:-8765}"
public_url = "${MCPGW_PUBLIC_URL:-http://localhost:8765}"
api_key = "${MCPGW_API_KEY}"
state_dir = "/data"

[servers.notion]
provider = "notion"

[servers.linear]
provider = "linear"
